<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | Portal INTECOAL</title>

    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/styles.css">

    <link rel="stylesheet" href="dashboard.css">

</head>

<body>

<div class="dashboard">

    <header class="dashboard-header">

        <div>

            <h1>Dashboard</h1>

        </div>

        <button class="btn-recargar" onclick="cargarDashboard()">

            🔄 Actualizar

        </button>

    </header>


    <section class="cards">

        <div class="card azul">

            <h2 id="totalSolicitudes">0</h2>

            <p>Total Solicitudes</p>

        </div>

        <div class="card amarillo">

            <h2 id="recibidas">0</h2>

            <p>Recibidas</p>

        </div>

        <div class="card naranja">

            <h2 id="enRevision">0</h2>

            <p>En Revisión</p>

        </div>

        <div class="card verde">

            <h2 id="aprobadas">0</h2>

            <p>Aprobadas</p>

        </div>

        <div class="card rojo">

            <h2 id="rechazadas">0</h2>

            <p>Rechazadas</p>

        </div>

    </section>


    <section class="cards">

        <div class="card blanco">

            <h3>Documentos</h3>

            <h2 id="totalDocumentos">0</h2>

        </div>

        <div class="card blanco">

            <h3>Hoy</h3>

            <h2 id="solicitudesHoy">0</h2>

        </div>

        <div class="card blanco">

            <h3>Mes</h3>

            <h2 id="solicitudesMes">0</h2>

        </div>

        <div class="card blanco">

            <h3>% Aprobación</h3>

            <h2 id="porcentajeAprobacion">0%</h2>

        </div>

    </section>


    <section class="tabla-card">

        <h2>Últimas Solicitudes</h2>

        <table>

            <thead>

            <tr>

                <th>Radicado</th>

                <th>Proyecto</th>

                <th>Municipio</th>

                <th>Responsable</th>

                <th>Estado</th>

                <th>Fecha</th>

            </tr>

            </thead>

            <tbody id="tablaSolicitudes">

            </tbody>

        </table>

    </section>

</div>

<script src="dashboard.js"></script>

</body>

</html>
